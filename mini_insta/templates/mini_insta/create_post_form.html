
{% extends "mini_insta/base.html" %}

{% block content %}
<h2>Create a Post for {{ profile.display_name }}</h2>

<form method="POST" action="{% url 'create_post' profile.pk %}">
  {% csrf_token %}

  {{ form.as_p }}

  <p>
    <label for="id_image_url">Image URL:</label>
    <input type="url" name="image_url" id="id_image_url" required>
  </p>

  <button type="submit">Submit</button>
  <a href="{% url 'show_profile' profile.pk %}">Cancel</a>
</form>
{% endblock %}
