

{% extends "mini_insta/base.html" %}
{% block content %}
<h2>Create a Post for {{ profile.display_name }}</h2>

<form method="POST"
      action="{% url 'create_post' %}"
      enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}

  <p>
    <label for="id_files">Upload Images:</label>
    <input type="file" name="files" id="id_files" multiple>
  </p>

  <button type="submit">Submit</button>
  <a href="{% url 'show_my_profile' %}">Cancel</a>
</form>
{% endblock %}
