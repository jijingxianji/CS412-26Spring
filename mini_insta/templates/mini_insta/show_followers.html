{% extends "mini_insta/base.html" %}
{% block content %}
<h2>Followers of {{ profile.display_name }}</h2>

<ul>
  {% for p in profile.get_followers %}
    <li><a href="{% url 'show_profile' p.pk %}">{{ p.username }} — {{ p.display_name }}</a></li>
  {% empty %}
    <li>No followers yet.</li>
  {% endfor %}
</ul>

<a href="{% url 'show_profile' profile.pk %}">Back</a>
{% endblock %}
