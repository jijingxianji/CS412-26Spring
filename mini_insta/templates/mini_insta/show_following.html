{% extends "mini_insta/base.html" %}
{% block content %}
<h2>{{ profile.display_name }} is following</h2>

<ul>
  {% for p in profile.get_following %}
    <li><a href="{% url 'show_profile' p.pk %}">{{ p.username }} — {{ p.display_name }}</a></li>
  {% empty %}
    <li>Not following anyone yet.</li>
  {% endfor %}
</ul>

<a href="{% url 'show_profile' profile.pk %}">Back</a>
{% endblock %}
