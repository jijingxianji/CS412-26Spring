


{% extends "quotes/base.html" %}
{% load static %}

{% block content %}
  <h2>All Quotes</h2>

  <div class="grid">
    {% for item in items %}
      <div class="card">
        <p class="quote-text">“{{ item.text }}”</p>
        <p class="quote-author">{{ item.author }}</p>
        <img class="small-img" src="{% static item.image %}" alt="{{ item.author }}">
      </div>
    {% endfor %}
  </div>
{% endblock %}
