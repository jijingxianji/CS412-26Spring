{% extends 'voter_analytics/base.html' %}

{% block content %}
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<h1>Graphs</h1>

<form method="get">
    <div>
        <label>Party:</label>
        <select name="party">
            <option value="">All</option>
            {% for p in party_choices %}
                <option value="{{ p }}" {% if selected_party == p %}selected{% endif %}>
                    {{ p }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label>Min birth year:</label>
        <select name="min_year">
            <option value="">Any</option>
            {% for y in year_choices %}
                <option value="{{ y }}" {% if selected_min_year == y|stringformat:"s" %}selected{% endif %}>
                    {{ y }}
                </option>
            {% endfor %}
        </select>

        <label>Max birth year:</label>
        <select name="max_year">
            <option value="">Any</option>
            {% for y in year_choices %}
                <option value="{{ y }}" {% if selected_max_year == y|stringformat:"s" %}selected{% endif %}>
                    {{ y }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label>Voter score:</label>
        <select name="voter_score">
            <option value="">Any</option>
            {% for s in score_choices %}
                <option value="{{ s }}" {% if selected_score == s|stringformat:"s" %}selected{% endif %}>
                    {{ s }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label><input type="checkbox" name="v20state" {% if checked_v20state %}checked{% endif %}> v20state</label>
        <label><input type="checkbox" name="v21town" {% if checked_v21town %}checked{% endif %}> v21town</label>
        <label><input type="checkbox" name="v21primary" {% if checked_v21primary %}checked{% endif %}> v21primary</label>
        <label><input type="checkbox" name="v22general" {% if checked_v22general %}checked{% endif %}> v22general</label>
        <label><input type="checkbox" name="v23town" {% if checked_v23town %}checked{% endif %}> v23town</label>
    </div>

    <button type="submit">Filter</button>
    <a href="{% url 'graphs' %}">Clear</a>
</form>

<h2>Birth Year Distribution</h2>
{{ birth_chart|safe }}

<h2>Party Affiliation Distribution</h2>
{{ party_chart|safe }}

<h2>Election Participation Distribution</h2>
{{ election_chart|safe }}
{% endblock %}
