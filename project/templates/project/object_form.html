{% extends 'project/base.html' %}

{% block content %}
<section class="panel">
    <p class="eyebrow">Form</p>
    <h2 style="margin-top: 8px;">{{ page_title }}</h2>
    <p class="section-subtitle">Fill in the fields below and save your changes.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="action-row">
            <button type="submit">{{ submit_label }}</button>
            <a class="button button-secondary" href="{{ back_url }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
